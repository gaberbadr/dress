version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Project1-api 
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy  # Wait for DB to be healthy
    environment:
      # Connection Strings
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection}"
      ConnectionStrings__REDIS_URL: "${ConnectionStrings__REDIS_URL}"
      
      # JWT Configuration
      JWT__Key: "${JWT__Key}"
      JWT__Issuer: "${JWT__Issuer}"
      JWT__Audience: "${JWT__Audience}"
      JWT__AccessTokenExpirationMinutes: "${JWT__AccessTokenExpirationMinutes:-15}"
      JWT__RefreshTokenExpirationDays: "${JWT__RefreshTokenExpirationDays:-7}"
      
      # Email Configuration
      Email__Host: "${Email__Host:-smtp.gmail.com}"
      Email__Port: "${Email__Port:-587}"
      Email__SmtpUsername: "${Email__SmtpUsername}"
      Email__SmtpPassword: "${Email__SmtpPassword}"
      Email__SenderEmail: "${Email__SenderEmail}"
      Email__SenderDisplayName: "${Email__SenderDisplayName:-Gaber Company}"
      Email__EnableSsl: "${Email__EnableSsl:-true}"
      Email__ExpirationMinutes: "${Email__ExpirationMinutes:-720}"

      # Google Authentication
      Authentication__Google__ClientId: "${Authentication__Google__ClientId}"
      Authentication__Google__ClientSecret: "${Authentication__Google__ClientSecret}"
      
      # Cloudinary Settings
      CloudinarySettings__CloudName: "${CloudinarySettings__CloudName}"
      CloudinarySettings__ApiKey: "${CloudinarySettings__ApiKey}"
      CloudinarySettings__ApiSecret: "${CloudinarySettings__ApiSecret}"
      
      # Redis Cache Settings
      CacheSettings__Redis__Enabled: "${CacheSettings__Redis__Enabled:-true}"
      CacheSettings__Redis__DefaultExpirationMinutes: "${CacheSettings__Redis__DefaultExpirationMinutes:-1}"
      CacheSettings__Redis__ConnectTimeoutMs: "${CacheSettings__Redis__ConnectTimeoutMs:-10000}"
      CacheSettings__Redis__SyncTimeoutMs: "${CacheSettings__Redis__SyncTimeoutMs:-10000}"
      
      # Rate Limiting Configuration
      RateLimiting__Authenticated__Requests: "${RateLimiting__Authenticated__Requests:-100}"
      RateLimiting__Authenticated__WindowSeconds: "${RateLimiting__Authenticated__WindowSeconds:-60}"
      RateLimiting__Anonymous__Requests: "${RateLimiting__Anonymous__Requests:-30}"
      RateLimiting__Anonymous__WindowSeconds: "${RateLimiting__Anonymous__WindowSeconds:-60}"
      RateLimiting__Global__Requests: "${RateLimiting__Global__Requests:-1000}"
      RateLimiting__Global__WindowSeconds: "${RateLimiting__Global__WindowSeconds:-60}"
      RateLimiting__ClientIdCookieName: "${RateLimiting__ClientIdCookieName:-X-Client-Id}"
      RateLimiting__ClientIdCookieExpirationDays: "${RateLimiting__ClientIdCookieExpirationDays:-30}"
      
      # Login Rate Limiter Configuration
      LoginRateLimiter__MaxAttempts: "${LoginRateLimiter__MaxAttempts:-5}"
      LoginRateLimiter__AttemptWindowMinutes: "${LoginRateLimiter__AttemptWindowMinutes:-15}"
      LoginRateLimiter__BanDurationHours: "${LoginRateLimiter__BanDurationHours:-3}"
      
      # URLs
      BaseURL: "${BaseURL:-http://localhost:5000}"
      Frontend__AllowedBaseUrls__0: "${Frontend__AllowedBaseUrls__0:-http://127.0.0.1:5500}"
      Frontend__AllowedBaseUrls__1: "${Frontend__AllowedBaseUrls__1:-http://localhost:3000}"
      Frontend__AllowedBaseUrls__2: "${Frontend__AllowedBaseUrls__2:-http://localhost:5000}"
      
      # ASP.NET Core Settings
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      
    volumes:
      - api_files:/app/wwwroot/files
    networks:
      - Project1-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Project1-sql
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - Project1-network
    restart: unless-stopped
    healthcheck:
      test: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sql_data:
  api_files:

networks:
  Project1-network:
    driver: bridge